[build-system]
requires = [
  "cython>=3.0",
  "numpy>=1.24,<3",
  "setuptools>=77",
  "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "core-sg"
version = "0.0.2"
description = "Core-SG graph construction and MST extraction utilities for HDBSCAN-style clustering."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Midas Core-SG Team", email = "gmcorlando@estudante.ufscar.br" },
]
keywords = [
  "core-sg",
  "clustering",
  "hdbscan",
  "graph",
  "mst",
  "density-based-clustering",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "hdbscan>=0.8.39",
  "pynndescent>=0.5.13",
  "numba<0.63; platform_system == 'Darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.15.0",
  "build>=1.2.2",
  "cibuildwheel>=3.1",
  "twine>=5.1.0",
]
docs = [
  "sphinx>=7",
  "sphinx-rtd-theme>=2",
  "sphinx-autodoc-typehints>=2",
  "myst-parser>=2",
  "nbsphinx>=0.9",
  "ipython",
  "matplotlib",
  "pandas",
  "scikit-learn",
]

[project.urls]
Source = "https://github.com/midas-core-sg/core-sg"
Issues = "https://github.com/midas-core-sg/core-sg/issues"
Documentation = "https://midas-core-sg.github.io/core-sg/"

[tool.setuptools]
include-package-data = true
zip-safe = false
ext-modules = [
  {name = "core_sg._mst_kruskal", sources = ["core_sg/_mst_kruskal.pyx"]},
  {name = "core_sg._reweight", sources = ["core_sg/_reweight.pyx"]},
]

[tool.setuptools.packages.find]
include = ["core_sg", "core_sg.*"]

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = ["*-musllinux_*", "*-manylinux_i686", "pp*"]
archs = ["auto64"]
test-extras = ["test"]
test-sources = ["tests", "benchmarking", "pyproject.toml"]
test-command = "python -m pytest tests -v -ra"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: Fast tests that isolate a small unit of behavior with controlled doubles.",
  "integration: Tests that exercise the library against real external behavior or package boundaries.",
  "validation: Algorithmic equivalence and behavior-validation tests across multiple k values.",
  "slow: Tests that are intentionally heavier and may take longer to execute.",
]

[tool.coverage.run]
branch = true
source = ["core_sg"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py310"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"tests/integration/test_reference_equivalence.py" = ["E402"]
"tests/validation/conftest.py" = ["E402"]
